[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topological-collapse-agent-societies"
version = "0.1.0"
description = "Higher-order topology analysis and multi-agent experiments for AI agent societies"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
  "huggingface_hub>=0.20.0",
  "hypernetx>=2.3.0",
  "networkx>=3.2",
  "scipy>=1.11.0",
  "numpy>=1.25.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "tqdm>=4.66.0",
  "python-dotenv>=1.0.0",
  "aiohttp>=3.9.0",
  "aiosqlite>=0.19.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
